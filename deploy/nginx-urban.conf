# Operators reach the platform over HTTPS; the platform itself listens on 127.0.0.1:8080.
# Devices do not come through here: they use the TLS listener on 8443 with the platform's own CA.
limit_req_zone $binary_remote_addr zone=urban_login:1m rate=10r/m;

server {
    listen 80;
    server_name urban.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name urban.example.uz;

    ssl_certificate     /etc/letsencrypt/live/urban.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urban.example.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 64k;

    location /api/login {
        limit_req zone=urban_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}
