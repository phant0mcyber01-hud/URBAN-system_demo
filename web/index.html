<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URBAN City OS · центр управления</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#04070a" />
</head>
<body>
  <div id="map"></div>

  <header id="top">
    <div id="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 7.5v6M16 18.5v6M7.5 16h6M18.5 16h6" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="4" height="4" fill="currentColor"/></svg><b>URBAN</b><span>City OS · центр управления</span></div>
    <div id="sys">
      <span id="modechip" class="chip" hidden></span>
      <span id="link" class="chip ok" hidden>связь с оборудованием</span>
    </div>
    <div id="op-tools" hidden>
      <button id="op-revoke" class="danger" title="Немедленно вернуть все светофоры к базовому плану">Отозвать всё</button>
      <div id="op-account">
        <button id="op-user" class="chip ok" aria-haspopup="menu"></button>
        <div id="op-menu" role="menu" hidden>
          <button id="op-users" role="menuitem">Учётные записи</button>
          <button id="op-link" role="menuitem" title="Имитация: платформа перестаёт продлевать команды">Отключить связь</button>
          <button id="op-logout" role="menuitem">Выйти</button>
        </div>
      </div>
    </div>
    <span id="clock">0:00</span>
  </header>

  <nav id="rail" aria-label="Разделы"><div id="tabs"></div></nav>

  <div id="left">
    <div id="search" class="glass">
      <input id="q" type="search" placeholder="Поиск: улица, больница, камера…  ( / )" autocomplete="off" spellcheck="false" />
      <ul id="results" hidden></ul>
    </div>
    <div id="place" class="glass" hidden></div>
  </div>

  <aside id="side" class="glass"><div id="panel"></div></aside>

  <section id="cam" class="glass" hidden>
    <header>
      <b id="cam-title"></b>
      <button id="cam-prev" title="Предыдущая камера">‹</button>
      <button id="cam-next" title="Следующая камера">›</button>
      <button id="cam-close" title="Закрыть">✕</button>
    </header>
    <div id="camview"></div>
    <div id="cam-hud"></div>
  </section>

  <section id="enrol" class="glass" hidden>
    <header><b>Подключить блок URBAN Edge</b><button id="enrol-close" title="Закрыть">✕</button></header>
    <div id="enrol-body"></div>
  </section>

  <section id="users" class="glass" hidden>
    <header><b id="users-title">Учётные записи</b><button id="users-close" title="Закрыть">✕</button></header>
    <div id="users-body"></div>
  </section>

  <div id="login" hidden>
    <form id="login-form" class="glass" autocomplete="on">
      <div class="login-brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 7.5v6M16 18.5v6M7.5 16h6M18.5 16h6" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="4" height="4" fill="currentColor"/></svg><b>URBAN</b><span>City OS · операционная система умного города</span></div>
      <ul id="boot" aria-live="polite"><li><b>URBAN://</b> связь с сервером…</li></ul>
      <p class="muted">Вход только по учётной записи. Роли: наблюдатель, оператор, администратор.</p>
      <label>Имя <input id="login-name" autocomplete="username" required autofocus /></label>
      <label>Пароль <input id="login-pass" type="password" autocomplete="current-password" required /></label>
      <label id="login-code-row" hidden>Код из приложения <input id="login-code" inputmode="numeric" autocomplete="one-time-code"
        maxlength="6" pattern="[0-9]{6}" placeholder="6 цифр" /></label>
      <button type="submit">Войти</button>
      <small id="login-err" class="err"></small>
    </form>
  </div>

  <div id="layers" class="glass">
    <button id="layers-btn">Слои</button>
    <div id="layers-menu" hidden></div>
  </div>
  <div id="foot">
    <span id="foot-note"></span>
    <span id="perf"></span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
