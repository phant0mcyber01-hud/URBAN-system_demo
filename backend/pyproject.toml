[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban"
version = "0.1.0"
description = "URBAN: city infrastructure platform and the software of its URBAN Edge units"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "websockets",
  "cryptography",
]

[project.optional-dependencies]
demo = ["eclipse-sumo", "traci", "sumolib", "pyproj"]  # the demo twin and the measurements, not the real system
dev = ["pytest", "pysnmp>=7.1,<8", "urban[demo]", "urban[vision]"]  # pysnmp: an independent agent for the SNMPv3 tests only
edge = ["pyserial"]  # a unit in a cabinet with a relay board on a serial port
vision = ["numpy", "opencv-python-headless", "onnxruntime"]  # camera vision on the unit (python -m urban.vision)

[project.scripts]
urban-prepare = "urban.pipeline.__main__:main"
urban-serve = "urban.__main__:main"
urban-city = "urban.city.__main__:main"

[tool.setuptools.packages.find]
include = ["urban*"]

[tool.setuptools.package-data]
"urban.equipment" = ["profiles/*.json"]
"urban.modules.water" = ["map-template.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
