# Maintenance access: SSH keys from the data partition only, no passwords, nothing forwarded but the
# local tunnel to the camera calibration page.
HostKey /var/lib/urban/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /var/lib/urban/ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
AllowUsers root
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
AllowTcpForwarding local
MaxAuthTries 3
# modern cryptography only (OpenSSH 9.2 on bookworm): post-quantum hybrid key exchange first, AEAD ciphers,
# encrypt-then-MAC; nothing with SHA-1, CBC or small Diffie-Hellman groups
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com,ecdsa-sha2-nistp256,rsa-sha2-512
# a scanner gets 20 seconds and three tries, and few half-open connections at a time
LoginGraceTime 20
MaxStartups 3:50:10
MaxSessions 4
ClientAliveInterval 60
ClientAliveCountMax 3
PermitUserEnvironment no
GatewayPorts no
