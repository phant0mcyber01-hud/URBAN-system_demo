<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- URBAN OS: only root may talk to RAUC. RAUC's own policy (/usr/share/dbus-1/system.d) lets every user ask it to
     install a bundle or mark a slot good or bad; a hijacked unit service (user urban) could then install any genuine
     bundle, or mark slots so that the automatic rollback no longer works. Updates go through the root helper
     (urban-unit apply-update), rollback through urban-health: both run as root. This file is read after the package's,
     so its default-context deny wins over the package's default-context allow. -->
<busconfig>
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
</busconfig>
