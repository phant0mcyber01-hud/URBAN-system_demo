# /run/urban: the machine's live state (power plan, relay counts, the screen's lines, the firewall's role rules).
# Root's only: a service that could write here could plant a link that a root script then writes through.
# /run/urban/q: the one place the camera vision (its own user, urban-vision) writes its queue lengths; the unit
# and the district server read them.
d /run/urban 0755 root root -
d /run/urban/q 0755 urban-vision urban -
# /run/urban/light (a lighting cabinet's state) is made by urban-prepare on a lighting cabinet only.
