# Updates: signed bundles (the keyring is the URBAN update CA), written into the slot that is not running.
[system]
compatible=urban-edge-x86_64
bootloader=grub
grubenv=/boot/efi/EFI/BOOT/grubenv
statusfile=/var/lib/urban/rauc.status
data-directory=/var/lib/urban/rauc

[keyring]
path=/etc/rauc/keyring.pem
# releases are signed with a code-signing certificate from the URBAN update CA
check-purpose=codesign

# The slots are the partitions rootfs-a and rootfs-b of the disk this unit booted from (/dev/disk/urban/*, made by
# etc/udev/rules.d/60-urban-bootdisk.rules): an update is never written to a partition of the same name on another disk.
[slot.rootfs.0]
device=/dev/disk/urban/rootfs-a
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/urban/rootfs-b
type=raw
bootname=B
