# URBAN Edge OS boot: two root slots, A and B, chosen by the boot state RAUC keeps in grubenv.
# A slot is bootable when it is OK and not already being tried. Booting it sets TRY; a healthy system
# clears TRY by marking itself good (urban-health). A system that never marks itself good, crashes or
# hangs (the watchdog resets it) is skipped at the next boot: the unit falls back to the other slot.
set timeout=1
# Booting needs nothing; editing a boot line or getting a GRUB shell needs the maintenance password (a keyboard in
# the cabinet must not get root with init=/bin/sh). The line below is filled in by the build.
# URBAN-GRUB-PASSWORD
set default=0
set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

regexp --set 1:disk '^\((.*),gpt[0-9]+\)' "$cmdpath"

set chosen=""
for SLOT in $ORDER; do
    if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then set chosen=A; set A_TRY=1; break; fi
    if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then set chosen=B; set B_TRY=1; break; fi
done
# Every good slot was already tried and none marked itself good (a power cut or a hang right after boot): do not
# halt a unit that has a working system - boot the first good slot again rather than none.
if [ -z "$chosen" ]; then
    for SLOT in $ORDER; do
        if [ "$SLOT" = "A" -a "$A_OK" = "1" ]; then set chosen=A; break; fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" ]; then set chosen=B; break; fi
    done
fi
save_env A_TRY B_TRY

# the kernel locked down: not even root may read kernel memory (/dev/mem, /proc/kcore) or load unsigned code;
# no debugfs, no legacy vsyscall page, randomised kernel stack and page allocator, no merged slab caches
set CMDLINE="ro rootfstype=squashfs rootwait console=tty0 console=ttyS0,115200 panic=10 lockdown=confidentiality debugfs=off vsyscall=none slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on"

if [ "$chosen" = "A" ]; then
    set default=0
elif [ "$chosen" = "B" ]; then
    set default=1
else
    set default=2
fi

menuentry "URBAN OS, slot A" --unrestricted {
    linux ($disk,gpt2)/boot/vmlinuz root=/dev/disk/by-partlabel/rootfs-a rauc.slot=A $CMDLINE
    initrd ($disk,gpt2)/boot/initrd.img
}
menuentry "URBAN OS, slot B" --unrestricted {
    linux ($disk,gpt3)/boot/vmlinuz root=/dev/disk/by-partlabel/rootfs-b rauc.slot=B $CMDLINE
    initrd ($disk,gpt3)/boot/initrd.img
}
menuentry "No bootable slot: halt" --unrestricted {
    echo "URBAN Edge OS: neither slot is bootable. Reflash the unit."
    sleep 30
    halt
}
