# URBAN Edge OS boot: two root slots, A and B, chosen by the boot state RAUC keeps in grubenv.
# A slot is bootable when it is OK and not already being tried. Booting it sets TRY; a healthy system
# clears TRY by marking itself good (urban-health). A system that never marks itself good, crashes or
# hangs (the watchdog resets it) is skipped at the next boot: the unit falls back to the other slot.
#
# Secure boot chain: this file is loaded by the signed boot loader, which was built with check_signatures=enforce and
# URBAN's boot key inside it: this file, the slot's boot file (/EFI/URBAN/slot-X.cfg), the kernel and the initrd are
# executed or loaded only with a valid detached signature (.sig next to each). The only unsigned file GRUB reads is
# grubenv, and from it only the seven variables named below. The slot's boot file carries the dm-verity root hash of
# the slot, which the initramfs checks the whole read-only system against.
set timeout=1
# Booting needs nothing; editing a boot line or getting a GRUB shell needs the maintenance password (a keyboard in
# the cabinet must not get root with init=/bin/sh). The line below is filled in by the build.
# URBAN-GRUB-PASSWORD
set default=0
set fallback=""
set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
set A_FAIL=0
set B_FAIL=0
load_env --skip-sig ORDER A_OK A_TRY A_FAIL B_OK B_TRY B_FAIL

regexp --set 1:disk '^\((.*),gpt[0-9]+\)' "$cmdpath"

set chosen=""
for SLOT in $ORDER; do
    if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then set chosen=A; set A_TRY=1; break; fi
    if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then set chosen=B; set B_TRY=1; break; fi
done
# Every good slot was already tried and none marked itself good (a power cut or a hang right after boot): do not
# halt a unit that has a working system - boot the first good slot again rather than none. But not for ever: a slot
# chosen like this counts a failed try (X_FAIL: 0, 1, 2; the first try is not counted), and a slot with two retries
# behind it - three tries in all, e.g. a dm-verity error that panics the kernel every time - is not chosen again.
# With no slot left GRUB halts with a message, instead of a reboot loop. A slot that marks itself good (urban-health)
# or a new image in it starts again from 0. (GRUB scripts cannot add: the counter is a ladder.)
if [ -z "$chosen" ]; then
    for SLOT in $ORDER; do
        if [ "$SLOT" = "A" -a "$A_OK" = "1" ]; then
            if [ "$A_FAIL" = "0" ]; then set chosen=A; set A_FAIL=1; break; fi
            if [ "$A_FAIL" = "1" ]; then set chosen=A; set A_FAIL=2; break; fi
        fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" ]; then
            if [ "$B_FAIL" = "0" ]; then set chosen=B; set B_FAIL=1; break; fi
            if [ "$B_FAIL" = "1" ]; then set chosen=B; set B_FAIL=2; break; fi
        fi
    done
fi
save_env A_TRY B_TRY A_FAIL B_FAIL

# the kernel locked down: not even root may read kernel memory (/dev/mem, /proc/kcore) or load unsigned code;
# no debugfs, no legacy vsyscall page, randomised kernel stack and page allocator, no merged slab caches
set CMDLINE="ro rootfstype=squashfs rootwait console=tty0 console=ttyS0,115200 panic=10 lockdown=confidentiality debugfs=off vsyscall=none slab_nomerge page_alloc.shuffle=1 randomize_kstack_offset=on"

# The entry that boots the chosen slot is tried first; if it fails (no or a bad signature on the slot's boot file, the
# kernel or the initrd, a slot that is not there) GRUB goes on to the other slot - when that one is good - and last
# to the halt entry.
if [ "$chosen" = "A" ]; then
    set default=0
    if [ "$B_OK" = "1" ]; then set fallback="1 2"; else set fallback="2"; fi
elif [ "$chosen" = "B" ]; then
    set default=1
    if [ "$A_OK" = "1" ]; then set fallback="0 2"; else set fallback="2"; fi
else
    set default=2
fi

# Each slot's entry reads the slot's signed boot file (URBAN_ROOTHASH, URBAN_HASHOFFSET, URBAN_VERSION), checks the
# signatures of the kernel and the initrd, and that their sha256 are those in the slot's signed hash list
# (/EFI/URBAN/slot-X.sha256, made by the same build as the boot file) before loading either: without all of it
# nothing is loaded, the entry fails
# and GRUB goes on to the fallback (there is no unverified way in). GRUB does not let menu entries call functions
# defined in this file, so the two entries spell it out. Booting a slot counts as a try, also as a fallback.
menuentry "URBAN OS, slot A" --unrestricted {
    set URBAN_ROOTHASH=""
    set URBAN_HASHOFFSET=""
    set URBAN_VERSION=""
    source ($disk,gpt1)/EFI/URBAN/slot-A.cfg
    if [ -n "$URBAN_ROOTHASH" -a -n "$URBAN_HASHOFFSET" ]; then
        if verify_detached ($disk,gpt2)/boot/vmlinuz ($disk,gpt2)/boot/vmlinuz.sig; then
            if verify_detached ($disk,gpt2)/boot/initrd.img ($disk,gpt2)/boot/initrd.img.sig; then
                # the kernel and the initrd must be the very ones this slot's build made: their sha256 are in the slot's
                # signed hash list on the ESP (the signature alone would also pass an older, validly signed pair swapped in)
                if verify_detached ($disk,gpt1)/EFI/URBAN/slot-A.sha256 ($disk,gpt1)/EFI/URBAN/slot-A.sha256.sig; then
                    if hashsum --hash sha256 --check ($disk,gpt1)/EFI/URBAN/slot-A.sha256 --prefix ($disk,gpt2); then
                        set A_TRY=1
                        save_env A_TRY
                        echo "URBAN OS: booting slot A, version $URBAN_VERSION"
                        linux ($disk,gpt2)/boot/vmlinuz root=/dev/mapper/urban-root urban.verity=rootfs-a:$URBAN_ROOTHASH:$URBAN_HASHOFFSET rauc.slot=A $CMDLINE
                        initrd ($disk,gpt2)/boot/initrd.img
                    else
                        echo "URBAN OS: slot A: the kernel or the initrd is not the one of the signed hash list - not booting it"
                    fi
                fi
            fi
        fi
    else
        echo "URBAN OS: slot A has no valid signed boot file - not booting it"
    fi
}
menuentry "URBAN OS, slot B" --unrestricted {
    set URBAN_ROOTHASH=""
    set URBAN_HASHOFFSET=""
    set URBAN_VERSION=""
    source ($disk,gpt1)/EFI/URBAN/slot-B.cfg
    if [ -n "$URBAN_ROOTHASH" -a -n "$URBAN_HASHOFFSET" ]; then
        if verify_detached ($disk,gpt3)/boot/vmlinuz ($disk,gpt3)/boot/vmlinuz.sig; then
            if verify_detached ($disk,gpt3)/boot/initrd.img ($disk,gpt3)/boot/initrd.img.sig; then
                # the kernel and the initrd must be the very ones this slot's build made: their sha256 are in the slot's
                # signed hash list on the ESP (the signature alone would also pass an older, validly signed pair swapped in)
                if verify_detached ($disk,gpt1)/EFI/URBAN/slot-B.sha256 ($disk,gpt1)/EFI/URBAN/slot-B.sha256.sig; then
                    if hashsum --hash sha256 --check ($disk,gpt1)/EFI/URBAN/slot-B.sha256 --prefix ($disk,gpt3); then
                        set B_TRY=1
                        save_env B_TRY
                        echo "URBAN OS: booting slot B, version $URBAN_VERSION"
                        linux ($disk,gpt3)/boot/vmlinuz root=/dev/mapper/urban-root urban.verity=rootfs-b:$URBAN_ROOTHASH:$URBAN_HASHOFFSET rauc.slot=B $CMDLINE
                        initrd ($disk,gpt3)/boot/initrd.img
                    else
                        echo "URBAN OS: slot B: the kernel or the initrd is not the one of the signed hash list - not booting it"
                    fi
                fi
            fi
        fi
    else
        echo "URBAN OS: slot B has no valid signed boot file - not booting it"
    fi
}
menuentry "No bootable slot: halt" --unrestricted {
    echo "URBAN Edge OS: neither slot is bootable (none installed, or the system did not come up in three tries). Reflash the unit."
    # The tries start again from the beginning, but only after a person (or the power) switches the unit on again: halt
    # powers it off, so a running unit cannot loop. Resetting TRY as well as FAIL makes it three tries again (the first
    # one through TRY, then the two counted retries), as on a unit that never failed.
    set A_TRY=0
    set B_TRY=0
    set A_FAIL=0
    set B_FAIL=0
    save_env A_TRY B_TRY A_FAIL B_FAIL
    sleep 30
    halt
}
